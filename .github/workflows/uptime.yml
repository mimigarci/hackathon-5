# Vigila https://botflow.lat desde fuera (runners de GitHub). Si falla, GitHub
# avisa por email a quien hizo el último cambio de este archivo.
name: uptime botflow.lat

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: DNS (IPv4) en resolvers públicos
        run: |
          for r in 1.1.1.1 8.8.8.8; do
            ips=$(dig +short A botflow.lat @$r)
            echo "@$r -> $ips"
            test -n "$ips"
          done

      - name: Webapp, API y voz
        run: |
          set -euo pipefail
          B=https://botflow.lat
          c() { curl -fsS --retry 3 --retry-delay 5 --retry-all-errors -m 15 "$@"; }
          c $B/health | tee /dev/stderr | grep -q '"status":"ok"'
          c $B/ | grep -q "Wisi"
          c -o /dev/null $B/assets/wisi_neutral.json
          test "$(curl -s -o /dev/null -w '%{http_code}' http://botflow.lat/)" = "301"
          T=$(c -X POST "$B/api/session?principal=uptime-bot&signed=false" | jq -r .session_token)
          c -X POST -H "Authorization: Bearer $T" $B/api/tool/get_balance | jq -e '.status == "ok"'
          c -X POST -H "Authorization: Bearer $T" $B/api/tool/list_movements | jq -e '.status == "ok" and (.data.movements | length) >= 1'
          c -X POST -H "Authorization: Bearer $T" $B/api/tool/get_credit | jq -e '.status == "ok"'
          c -o /dev/null $B/assets/app/features.js
          c -o /dev/null $B/assets/app/vendor/elevenlabs-client-0.7.1.js
          # WebRTC: token de conversación disponible para el micrófono.
          c -X POST "$B/api/session?principal=uptime-bot&voice=female&webrtc=true" | jq -e '.conversation_token != null'
          # Voz: la clave de ElevenLabs y el agente responden (no consume créditos hasta conectar).
          c -X POST "$B/api/session?principal=uptime-bot&voice=female" | jq -e '.voice_enabled == true'
