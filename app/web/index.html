<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="pago_directo">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>pago_directo</title>
  <link rel="manifest" href="manifest.json">

  <!-- Splash shown while main.dart.js and CanvasKit download; removed on the
       first Flutter frame so the page is never a blank white screen. -->
  <style>
    html, body { margin: 0; height: 100%; background: #F3F4F9; }
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 20px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #7A7A85; font-size: 14px; transition: opacity .25s;
    }
    #splash .logo {
      width: 72px; height: 72px; border-radius: 20px; background: #FF1764;
      color: #fff; font-weight: 800; font-size: 30px;
      display: flex; align-items: center; justify-content: center;
    }
    #splash .spinner {
      width: 28px; height: 28px; border-radius: 50%;
      border: 3px solid #E3E4EB; border-top-color: #FF1764;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="splash">
    <div class="logo">pd</div>
    <div class="spinner"></div>
    <div>Cargando PagoDirecto…</div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (!s) return;
      s.style.opacity = '0';
      setTimeout(function () { s.remove(); }, 300);
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
