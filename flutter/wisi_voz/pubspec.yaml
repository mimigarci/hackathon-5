name: wisi_voz
description: Agente de voz y chat in-app de PagoDirecto (Wisi). Reemplaza el salto a WhatsApp.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  web_socket_channel: ^3.0.0
  # Audio I/O para la sesión de voz (micrófono + reproducción del TTS de Wisi).
  # El canal de control (texto + client tools) ya funciona solo con web_socket_channel;
  # estos conectan el streaming de audio con ElevenLabs Conversational AI.
  record: ^5.1.0
  just_audio: ^0.9.40

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  assets:
    - assets/
